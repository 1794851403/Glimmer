# 生产 / 演示用 Nginx 同源反代；开发期用 Vite proxy，不必启动。
# 当 backend 以容器方式加入 docker-compose.yml 后，再挂载本文件。

# 统一 traceId：优先使用上游传入，没有则用 Nginx 的 request_id。
map $http_x_trace_id $trace_id {
    default $http_x_trace_id;
    ""      $request_id;
}

upstream glimmer_backend {
    server backend:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 6m;

    # 前端静态文件；Vue/React history 路由回退到 index.html
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Trace-Id $trace_id always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API
    location /api/ {
        proxy_pass http://glimmer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $trace_id;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # WebSocket 弹幕
    location /ws/ {
        proxy_pass http://glimmer_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Trace-Id $trace_id;
        proxy_read_timeout 3600s;
    }

    # SSE：必须关闭缓冲，否则流式变成一次性返回
    location /api/v1/ai/ {
        proxy_pass http://glimmer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $trace_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        add_header X-Accel-Buffering no;
        add_header X-Trace-Id $trace_id always;
    }
}
