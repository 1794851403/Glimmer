glimmer:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:192.168.157.129}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:glimmer}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USER:glimmer}
    password: ${MYSQL_PASSWORD:}
  flyway:
    baseline-on-migrate: true

logging:
  level:
    com.glimmer: debug
    org.springframework.jdbc.core: info
